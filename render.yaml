services:
  - type: web
    name: fenix-api
    runtime: node
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fenix-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: PUBLIC_BASE_URL
        fromService:
          type: static_site
          name: fenix-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SUPPLIER_PROVIDER
        value: none
      - key: SUPPLIER_API_KEY
        sync: false

  - type: static_site
    name: fenix-web
    rootDir: app
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: fenix-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: fenix-db
    databaseName: fenix
    user: fenix
    plan: free
